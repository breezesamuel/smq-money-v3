name: Deploy to Render

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Render
        uses: renderhq/action-deploy@v1
        with:
          render-cli-token: ${{ secrets.RENDER_TOKEN }}
          service-name: smq-api
          github-repo: breezesamuel/smq-money
          branch: master
          build-command: npm install
          start-command: node server.js
          envVars: |
            PORT=10000
            RATE_USD_TO_CNY=7.5