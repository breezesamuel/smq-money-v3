name: Okara Promo Daily

on:
  schedule:
    # 每 3 小时生成一轮推广（UTC），覆盖不同用户时区
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch:

jobs:
  promo-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run Okara promo daily
        env:
          # 模型密钥从仓库 Secrets 注入（不落盘）
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY_2: ${{ secrets.ZHIPU_API_KEY_2 }}
          VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # 真分发 webhook（Telegram/Twitter 等中间层），可选
          PROMO_WEBHOOK_URL: ${{ secrets.PROMO_WEBHOOK_URL }}
        run: node promo/run-daily.js --arcade 3 --tools 3

      - name: Commit promo state
        run: |
          git config user.name "okara-bot"
          git config user.email "okara-bot@users.noreply.github.com"
          git add promo-state.json 2>/dev/null || true
          git commit -m "chore(promo): daily okara campaign $(date -u +%Y-%m-%d)" 2>/dev/null || echo "no changes"
          git push origin HEAD:main 2>/dev/null || echo "push skipped"